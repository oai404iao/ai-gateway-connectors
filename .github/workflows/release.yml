name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tag and SDK revision
        id: version
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          ./scripts/check-release-version.sh "$GITHUB_REF_NAME" --require-pinned-sdk
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.97.1-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa
    timeout-minutes: 30
    steps:
      - name: Install packaging tools
        run: apt-get update && apt-get install --yes --no-install-recommends python3 binutils gcc git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify and package native library
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '$1 == "host:" { print $2 }')" = "$EXPECTED_TARGET"
          ./scripts/verify-release.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-${{ matrix.target }}
          path: |
            target/release-package/*.tar.gz
            target/release-package/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: connector-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          archives=(artifacts/*.tar.gz)
          checksums=(artifacts/*.tar.gz.sha256)
          test "${#archives[@]}" = 2
          test "${#checksums[@]}" = 2
          (cd artifacts; for checksum in *.tar.gz.sha256; do sha256sum -c "$checksum"; done)
          gh release create "$TAG" "${archives[@]}" "${checksums[@]}" \
            --verify-tag --title "$TAG" --generate-notes
