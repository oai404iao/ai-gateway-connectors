[workspace]
members = ["codex"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
ai-gateway-connector-sdk = { git = "https://github.com/oai404iao/ai_gateway", rev = "87892257453a11be128afa4f5ba863c93e9453f2" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
